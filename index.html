function normalizeFootprintTrack(){events.forEach(e=>{if(!e.tracks.includes('footprint'))e.tracks=['footprint',...e.tracks]})}
const state={activeTrack:'footprint',selectedEventId:'e001',selectedGroupKey:null,query:'',map:null,layers:[],hideMarkers:true,hideLines:false};const birthYear=1893;
function buildCodes(){const c={footprint:0,politics:0,works:0,poetry:0};events.slice().sort((a,b)=>a.year-b.year||a.date.localeCompare(b.date)).forEach(e=>{e.codes={};e.tracks.forEach(t=>{c[t]++;e.codes[t]=String(c[t])})})}
function ageAt(e){return Math.max(0,e.year-birthYear)+'岁'}function primaryCode(e){return e.codes[state.activeTrack]||''}function groupKey(e){const b=.18;return `${(Math.round(e.lat/b)*b).toFixed(2)},${(Math.round(e.lng/b)*b).toFixed(2)}`}
function visibleEvents(){return events.filter(e=>e.tracks.includes(state.activeTrack)&&(!state.query||[e.date,e.place,e.title,e.summary,...(e.readings||[]).map(id=>readings[id]?.title||'')].join(' ').toLowerCase().includes(state.query.toLowerCase()))).sort((a,b)=>a.year-b.year||a.date.localeCompare(b.date))}
function initMap(){if(!window.L)return;state.map=L.map('map',{minZoom:3,maxZoom:8,maxBounds:[[15,30],[62,140]],maxBoundsViscosity:.85}).setView([34.2,108.6],5);L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}',{subdomains:'1234',maxZoom:8,attribution:'高德地图'}).addTo(state.map)}
function clearMap(){state.layers.forEach(l=>l.remove());state.layers=[]}
function markerLabel(group){const codes=group.map(e=>Number(primaryCode(e)));const consecutive=codes.length>1&&codes.every((n,i)=>i===0||n===codes[i-1]+1);if(consecutive)return{mode:'range',count:1,html:`<button class="marker-bubble" data-key="${groupKey(group[0])}">${codes[0]}-${codes[codes.length-1]}</button>`};return{mode:'stack',count:Math.min(group.length,5),html:group.slice(0,5).map((e,i)=>i===4&&group.length>5?`<button class="marker-bubble marker-more" data-key="${groupKey(group[0])}">+</button>`:`<button class="marker-bubble" data-event-id="${e.id}">${primaryCode(e)}</button>`).join('')}}
function renderMap(){clearMap();if(!state.map)return;const vis=visibleEvents(),groups=new Map();vis.forEach(e=>{const k=groupKey(e);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(e)});const lineEvents=vis.filter(e=>e.tracks.includes(state.activeTrack));if(lineEvents.length>1&&!state.hideLines)state.layers.push(L.polyline(lineEvents.map(e=>[e.lat,e.lng]),{color:TRACKS[state.activeTrack].color,weight:1.5,opacity:.62,dashArray:'5 8',lineCap:'round'}).addTo(state.map));if(state.hideMarkers){const selected=vis.find(e=>e.id===state.selectedEventId)||vis[0];if(selected)state.layers.push(L.marker([selected.lat,selected.lng],{icon:L.divIcon({className:'',html:`<div class="focus-marker"><span>${primaryCode(selected)}</span></div>`,iconSize:[34,34],iconAnchor:[2,32]})}).addTo(state.map))}else{groups.forEach((g,k)=>{g.sort((a,b)=>a.year-b.year||a.date.localeCompare(b.date));const ml=markerLabel(g),w=ml.mode==='range'?74:ml.count*23+9,m=L.marker([g[0].lat,g[0].lng],{icon:L.divIcon({className:'',html:`<div class="marker-stack ${ml.mode}" data-key="${k}">${ml.html}</div>`,iconSize:[w,34],iconAnchor:[Math.round(w/2),17]})}).addTo(state.map);m.on('click',()=>selectGroup(k,g[0].id));state.layers.push(m)})}if(vis.length)state.map.fitBounds(L.latLngBounds(vis.map(e=>[e.lat,e.lng])).pad(.18),{animate:false,maxZoom:7});bindMarkerButtons();syncActive();renderMapInfoForSelection()}

function expandSummary(e){const extra={e001:'这是一生轨迹的起点，也说明韶山乡土环境与湖南地方社会对其早年经历的重要影响。',e004:'长沙是毛泽东青年时期接受新学、接触时局并开始形成政治意识的重要地点。',e012:'这次调查把农民运动作为观察中国革命的重要入口，后来成为理解其革命道路的重要材料。',e020:'遵义会议是长征途中具有重大转折意义的会议，党和红军的军事领导问题在此得到重要调整。',e022:'延安时期持续时间长，集中承载了抗日战争、党的建设、理论写作和干部教育等多重内容。',e029:'这一事件标志着中华人民共和国成立，也标志中国历史进入新的阶段。'};if(extra[e.id])return extra[e.id];const byTrack={works:['这个节点把地理行程和文本写作放在同一张地图上，便于看出理论问题从何处被提出。','从这里可以看到，相关文字并非孤立成篇，而是嵌在当时的组织任务和现实压力之中。','把作品放回发生地点阅读，会更容易理解它为什么在这个时刻出现。'],poetry:['这类诗词节点常常把实际行程、战地经验和历史想象压缩在短短几句里。','这里的地点不只是背景，也常常转化为诗词中的视觉意象和情绪转折。','沿时间线读到这里，可以看到行军、回望与抒情怎样交织在一起。'],politics:['这个政治节点改变了随后一段时期的行动方向，也让个人轨迹和组织进程更紧密地合在一起。','它更像是一处转折路标：之后的路线、部署和公开表达都受到影响。','放在地图上看，这一事件把区域行动推向了更大范围的历史进程。'],footprint:['这是一处行程节点，价值在于把人物经历、地方空间和当时局势重新对应起来。','从这一站继续往后看，可以看到个人活动范围如何随时代任务不断扩大。','这个地点保留了生平叙事中的一段现场感，也帮助理解后续选择的来路。']};const track=e.tracks.includes('works')?'works':e.tracks.includes('poetry')?'poetry':e.tracks.includes('politics')?'politics':'footprint';return pickText(e.id+e.title,byTrack[track])}

function featuredSnippet(r){const snippets={'《中国社会各阶级的分析》':'谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。','《湖南农民运动考察报告》':'湖南农民运动的兴起，不是偶然的乡村骚动，而是长期压迫后的社会力量重新组织。','《沁园春·长沙》':'独立寒秋，湘江北去，橘子洲头。看万山红遍，层林尽染。','《星星之火，可以燎原》':'小块红色区域能够长期存在，并不是幻想，而是中国政治经济发展不平衡的产物。','《实践论》':'实践、认识、再实践、再认识，这种形式，循环往复以至无穷。','《矛盾论》':'不同质的矛盾，只有用不同质的方法才能解决。','《论持久战》':'抗日战争不是速胜战，也不是亡国战，而是在敌强我弱条件下展开的持久战。','《为人民服务》':'人总是要死的，但死的意义有不同；为人民利益而死，就比泰山还重。','《七律·长征》':'红军不怕远征难，万水千山只等闲。五岭逶迤腾细浪，乌蒙磅礴走泥丸。','《七律·到韶山》':'别梦依稀咒逝川，故园三十二年前。红旗卷起农奴戟，黑手高悬霸主鞭。','《中国的红色政权为什么能够存在？》':'中国红色政权能够存在，要从白色政权分裂、群众基础、地形和武装力量中寻找原因。','《井冈山的斗争》':'井冈山经验不是单一军事经验，而是土地、群众、组织和武装斗争互相支撑。','《反对本本主义》':'没有调查，没有发言权；离开实际调查，就容易把本本当成现实。','《清平乐·会昌》':'东方欲晓，莫道君行早。踏遍青山人未老，风景这边独好。','《忆秦娥·娄山关》':'西风烈，长空雁叫霜晨月。霜晨月，马蹄声碎，喇叭声咽。','《沁园春·雪》':'北国风光，千里冰封，万里雪飘。望长城内外，惟余莽莽。','《新民主主义论》':'新民主主义不是旧式资产阶级民主主义，也不是立即进入社会主义的简单跳跃。','《改造我们的学习》':'有的放矢，就是拿马克思列宁主义的箭，去射中国革命的靶子。','《在延安文艺座谈会上的讲话》':'文艺为什么人的问题，是一个根本的问题，原则的问题。','《论联合政府》':'中国需要一个独立、自由、民主、统一和富强的新国家。','《论人民民主专政》':'人民民主专政的基础，是工人阶级、农民阶级和城市小资产阶级的联盟。','《论十大关系》':'把国内外一切积极因素调动起来，为社会主义事业服务。','《关于正确处理人民内部矛盾的问题》':'敌我矛盾和人民内部矛盾，是性质完全不同的两类矛盾。','《浪淘沙·北戴河》':'大雨落幽燕，白浪滔天，秦皇岛外打鱼船。一片汪洋都不见，知向谁边？','《水调歌头·游泳》':'才饮长沙水，又食武昌鱼。万里长江横渡，极目楚天舒。','《蝶恋花·答李淑一》':'我失骄杨君失柳，杨柳轻飏直上重霄九。问讯吴刚何所有，吴刚捧出桂花酒。','《七律·登庐山》':'一山飞峙大江边，跃上葱茏四百旋。冷眼向洋看世界，热风吹雨洒江天。','《卜算子·咏梅》':'风雨送春归，飞雪迎春到。已是悬崖百丈冰，犹有花枝俏。','《西江月·井冈山》':'山下旌旗在望，山头鼓角相闻。敌军围困万千重，我自岿然不动。','《采桑子·重阳》':'人生易老天难老，岁岁重阳。今又重阳，战地黄花分外香。','《如梦令·元旦》':'宁化、清流、归化，路隘林深苔滑。今日向何方，直指武夷山下。','《菩萨蛮·大柏地》':'赤橙黄绿青蓝紫，谁持彩练当空舞？雨后复斜阳，关山阵阵苍。','《十六字令三首》':'山，快马加鞭未下鞍。惊回首，离天三尺三。','《念奴娇·昆仑》':'横空出世，莽昆仑，阅尽人间春色。飞起玉龙三百万，搅得周天寒彻。','《七律·人民解放军占领南京》':'钟山风雨起苍黄，百万雄师过大江。虎踞龙盘今胜昔，天翻地覆慨而慷。','《七律·和柳亚子先生》':'饮茶粤海未能忘，索句渝州叶正黄。三十一年还旧国，落花时节读华章。','《反对日本帝国主义的策略》':'抗日民族统一战线的关键，是把最大多数能够反对日本帝国主义的力量联合起来。','《中国革命战争的战略问题》':'研究战争规律，必须研究中国革命战争自己的特点。','《战争和战略问题》':'革命的中心任务和最高形式，是武装夺取政权，是战争解决问题。','《中国革命和中国共产党》':'认清中国社会性质，才能认清中国革命的对象、任务、动力和前途。','《纪念白求恩》':'一个人能力有大小，但只要有这点精神，就是一个高尚的人。','《愚公移山》':'下定决心，不怕牺牲，排除万难，去争取胜利。','《党委会的工作方法》':'党委书记要善于当班长，把一班人组织起来，形成共同的工作步调。','《人的正确思想是从哪里来的？》':'人的正确思想，只能从社会实践中来。'};return snippets[r.title]||r.summary}

'《清平乐·会昌》':"东方欲晓，莫道君行早。\n踏遍青山人未老，风景这边独好。\n会昌城外高峰，颠连直接东溟。\n战士指看南粤，更加郁郁葱葱。",
'《忆秦娥·娄山关》':"西风烈，长空雁叫霜晨月。\n霜晨月，马蹄声碎，喇叭声咽。\n雄关漫道真如铁，而今迈步从头越。\n从头越，苍山如海，残阳如血。",
'《沁园春·雪》':"北国风光，千里冰封，万里雪飘。\n望长城内外，惟余莽莽；大河上下，顿失滔滔。\n山舞银蛇，原驰蜡象，欲与天公试比高。\n须晴日，看红装素裹，分外妖娆。\n江山如此多娇，引无数英雄竞折腰。\n惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。\n一代天骄，成吉思汗，只识弯弓射大雕。\n俱往矣，数风流人物，还看今朝。",
'《浪淘沙·北戴河》':"大雨落幽燕，白浪滔天，秦皇岛外打鱼船。\n一片汪洋都不见，知向谁边？\n往事越千年，魏武挥鞭，东临碣石有遗篇。\n萧瑟秋风今又是，换了人间。",
'《水调歌头·游泳》':"才饮长沙水，又食武昌鱼。\n万里长江横渡，极目楚天舒。\n不管风吹浪打，胜似闲庭信步，今日得宽馀。\n子在川上曰：逝者如斯夫！\n风樯动，龟蛇静，起宏图。\n一桥飞架南北，天堑变通途。\n更立西江石壁，截断巫山云雨，高峡出平湖。\n神女应无恙，当惊世界殊。",
'《蝶恋花·答李淑一》':"我失骄杨君失柳，杨柳轻飏直上重霄九。\n问讯吴刚何所有，吴刚捧出桂花酒。\n寂寞嫦娥舒广袖，万里长空且为忠魂舞。\n忽报人间曾伏虎，泪飞顿作倾盆雨。",
'《七律·登庐山》':"一山飞峙大江边，跃上葱茏四百旋。\n冷眼向洋看世界，热风吹雨洒江天。\n云横九派浮黄鹤，浪下三吴起白烟。\n陶令不知何处去，桃花源里可耕田？",
'《卜算子·咏梅》':"风雨送春归，飞雪迎春到。\n已是悬崖百丈冰，犹有花枝俏。\n俏也不争春，只把春来报。\n待到山花烂漫时，她在丛中笑。",
'《西江月·井冈山》':"山下旌旗在望，山头鼓角相闻。\n敌军围困万千重，我自岿然不动。\n早已森严壁垒，更加众志成城。\n黄洋界上炮声隆，报道敌军宵遁。",
'《采桑子·重阳》':"人生易老天难老，岁岁重阳。\n今又重阳，战地黄花分外香。\n一年一度秋风劲，不似春光。\n胜似春光，寥廓江天万里霜。",
'《如梦令·元旦》':"宁化、清流、归化，路隘林深苔滑。\n今日向何方，直指武夷山下。\n山下山下，风展红旗如画。",
'《菩萨蛮·大柏地》':"赤橙黄绿青蓝紫，谁持彩练当空舞？\n雨后复斜阳，关山阵阵苍。\n当年鏖战急，弹洞前村壁。\n装点此关山，今朝更好看。",
'《十六字令三首》':"山，快马加鞭未下鞍。惊回首，离天三尺三。\n山，倒海翻江卷巨澜。奔腾急，万马战犹酣。\n山，刺破青天锷未残。天欲坠，赖以柱其间。",
'《念奴娇·昆仑》':"横空出世，莽昆仑，阅尽人间春色。\n飞起玉龙三百万，搅得周天寒彻。\n夏日消溶，江河横溢，人或为鱼鳖。\n千秋功罪，谁人曾与评说？\n而今我谓昆仑：不要这高，不要这多雪。\n安得倚天抽宝剑，把汝裁为三截？\n一截遗欧，一截赠美，一截还东国。\n太平世界，环球同此凉热。",
'《七律·人民解放军占领南京》':"钟山风雨起苍黄，百万雄师过大江。\n虎踞龙盘今胜昔，天翻地覆慨而慷。\n宜将剩勇追穷寇，不可沽名学霸王。\n天若有情天亦老，人间正道是沧桑。",
'《七律·和柳亚子先生》':"饮茶粤海未能忘，索句渝州叶正黄。\n三十一年还旧国，落花时节读华章。\n牢骚太盛防肠断，风物长宜放眼量。\n莫道昆明池水浅，观鱼胜过富春江。",
'《菩萨蛮·黄鹤楼》':"茫茫九派流中国，沉沉一线穿南北。\n烟雨莽苍苍，龟蛇锁大江。\n黄鹤知何去？剩有游人处。\n把酒酹滔滔，心潮逐浪高！",
'《西江月·秋收起义》':"军叫工农革命，旗号镰刀斧头。\n匡庐一带不停留，要向潇湘直进。\n地主重重压迫，农民个个同仇。\n秋收时节暮云愁，霹雳一声暴动。",
'《清平乐·六盘山》':"天高云淡，望断南飞雁。\n不到长城非好汉，屈指行程二万。\n六盘山上高峰，红旗漫卷西风。\n今日长缨在手，何时缚住苍龙？",
'《减字木兰花·广昌路上》':"漫天皆白，雪里行军情更迫。\n头上高山，风卷红旗过大关。\n此行何去？赣江风雪迷漫处。\n命令昨颁，十万工农齐下。",
'《蝶恋花·从汀州向长沙》':"六月天兵征腐恶，万丈长缨要把鲲鹏缚。\n赣水那边红一角，偏师借重黄公略。\n百万工农齐踊跃，席卷江西直捣湘和鄂。\n国际悲歌歌一曲，狂飙为我从天落。",
'《渔家傲·反第一次大"围剿"》':"万木霜天红烂漫，天兵怒气冲霄汉。\n雾满龙冈千嶂暗，齐声唤，前头捉了张辉瓒。\n二十万军重入赣，风烟滚滚来天半。\n唤起工农千百万，同心干，不周山下红旗乱。",
'《渔家傲·反第二次大"围剿"》':"白云山头云欲立，白云山下呼声急，枯木朽株齐努力。\n枪林逼，飞将军自重霄入。\n七百里驱十五日，赣水苍茫闽山碧，横扫千军如卷席。\n有人泣，为营步步嗟何及！",
'《七律二首·送瘟神》':"其一\n绿水青山枉自多，华佗无奈小虫何！\n千村薜荔人遗矢，万户萧疏鬼唱歌。\n坐地日行八万里，巡天遥看一千河。\n牛郎欲问瘟神事，一样悲欢逐逝波。\n\n其二\n春风杨柳万千条，六亿神州尽舜尧。\n红雨随心翻作浪，青山着意化为桥。\n天连五岭银锄落，地动三河铁臂摇。\n借问瘟君欲何往，纸船明烛照天烧。",
'《七律·答友人》':"九嶷山上白云飞，帝子乘风下翠微。\n斑竹一枝千滴泪，红霞万朵百重衣。\n洞庭波涌连天雪，长岛人歌动地诗。\n我欲因之梦寥廓，芙蓉国里尽朝晖。",
'《七绝·为女民兵题照》':"飒爽英姿五尺枪，曙光初照演兵场。\n中华儿女多奇志，不爱红装爱武装。",
'《七绝·为李进同志题所摄庐山仙人洞照》':"暮色苍茫看劲松，乱云飞渡仍从容。\n天生一个仙人洞，无限风光在险峰。",
'《七律·冬云》':"雪压冬云白絮飞，万花纷谢一时稀。\n高天滚滚寒流急，大地微微暖气吹。\n独有英雄驱虎豹，更无豪杰怕熊罴。\n梅花欢喜漫天雪，冻死苍蝇未足奇。",
'《满江红·和郭沫若同志》':"小小寰球，有几个苍蝇碰壁。\n嗡嗡叫，几声凄厉，几声抽泣。\n蚂蚁缘槐夸大国，蚍蜉撼树谈何易。\n正西风落叶下长安，飞鸣镝。\n多少事，从来急；天地转，光阴迫。\n一万年太久，只争朝夕。\n四海翻腾云水怒，五洲震荡风雷激。\n要扫除一切害人虫，全无敌。",
'《水调歌头·重上井冈山》':"久有凌云志，重上井冈山。\n千里来寻故地，旧貌变新颜。\n到处莺歌燕舞，更有潺潺流水，高路入云端。\n过了黄洋界，险处不须看。\n风雷动，旌旗奋，是人寰。\n三十八年过去，弹指一挥间。\n可上九天揽月，可下五洋捉鳖，谈笑凯歌还。\n世上无难事，只要肯登攀。",
'《念奴娇·鸟儿问答》':"鲲鹏展翅，九万里，翻动扶摇羊角。\n背负青天朝下看，都是人间城郭。\n炮火连天，弹痕遍地，吓倒蓬间雀。\n怎么得了，哎呀我要飞跃。\n借问君去何方，雀儿答道：有仙山琼阁。\n不见前年秋月朗，订了三家条约。\n还有吃的，土豆烧熟了，再加牛肉。\n不须放屁！试看天地翻覆。",
'《七律·洪都》':"到得洪都又一年，祖生击楫至今传。\n闻鸡久听南天雨，立马曾挥北地鞭。\n鬓雪飞来成废料，壮心未与年俱老。\n老骥伏枥志千里，烈士暮年壮心还。"
};
function poemDisplayText(r){if(POEM_FULL_TEXTS[r.title])return POEM_FULL_TEXTS[r.title].trim();const lines=featuredSnippet(r).replace(/。/g,'。\n').replace(/？/g,'？\n').trim();return lines||r.summary}
function eraContextByYear(year,key=''){const eras=[{until:1911,texts:['晚清乡村社会仍以宗族、土地和传统教育为主，湖南地方社会的生活经验构成早年背景。','清末地方社会变动缓慢，家庭、私塾和乡土秩序仍是少年经验的主要来源。','这一时期的新旧世界尚未真正交替，乡村伦理、土地关系和传统教育共同塑造早年视野。']},{until:1921,texts:['辛亥革命后新旧制度转换，新式教育、新文化运动和地方政治变化共同塑造青年一代。','民国初年的湖南和北京都处在思想激荡中，新学、报刊和学生社团打开了新的问题意识。','帝制结束后秩序并未稳定，青年求学经历与新文化传播一起构成这一阶段的底色。']},{until:1927,texts:['国共合作和国民革命兴起，工人、农民、青年学生等社会力量迅速进入政治现场。','大革命时期的政治动员快速扩展，农民运动、工人运动和党派合作同时改变社会结构。','这一阶段的核心氛围是组织扩张与革命动员，许多判断都围绕“谁能被发动”展开。']},{until:1937,texts:['土地革命战争时期，中心议题转向武装斗争、农村根据地、土地问题和红军战略转移。','大革命失败后，革命重心转入乡村和军事斗争，根据地建设成为最重要的现实课题。','这一时期地点变化密集，文本与诗词多半贴着战事、转移和根据地经验生长。']},{until:1946,texts:['抗日战争时期，民族危机、统一战线、根据地建设和党的整风共同构成延安语境。','延安阶段把抗战、干部教育、理论整理和组织建设集中在一起，许多文本带有鲜明的教学和动员功能。','民族战争拉长了政治时间，统一战线、群众工作和思想整顿成为这一时期反复出现的主题。']},{until:1950,texts:['解放战争进入决胜阶段，新政权的政治结构、建国纲领和全国胜利成为核心问题。','抗战结束后国内政治急剧转向，军事胜利、谈判破裂和建国安排交替推进。','从西柏坡到北平，这一时期的文字和行动都指向政权转换与全国性治理。']},{until:1958,texts:['新中国成立后进入社会主义改造和建设探索阶段，国家制度、经济建设和社会矛盾成为重点。','建国初期的主题从夺取政权转向组织国家，经济恢复、制度建设和社会改造同步展开。','这一阶段的文本更多面向治理实践，讨论国家建设中不同关系如何摆放。']},{until:1966,texts:['社会主义建设在调整中前进，政治运动、经济困难和国际环境变化交织在一起。','五六十年代之交，建设经验、政策调整和意识形态分歧共同改变公共议题。','这一时期既有建设想象，也有困难后的反思，文本常在动员和总结之间摆动。']},{until:9999,texts:['二十世纪六七十年代中国政治高度动员，国内路线斗争和国际格局变化深刻影响公共生活。','进入六十年代中后期，政治运动强度上升，个人行程也越来越贴近国家高层政治节奏。','冷战格局、国内政治运动和群众动员交织，使这一阶段的事件带有更强的时代张力。']}];const era=eras.find(x=>year<x.until);return pickText(String(year)+key,era.texts)}
function readingContext(r){const base=eraContextByYear(Number(String(r.date).slice(0,4))||1893,r.title);const place=r.place||'这一地点';const add=r.type==='诗词'?[` 这首作品把${place}附近的行程经验转成更凝练的画面。`,` ${place}在这里更像触发点，地理现场和历史想象一起进入词句。`,` 读它时可以把${place}看作进入作品情绪的入口，而不是孤立的地名。`,` 这一阶段的奔走和停驻，让${place}带上了强烈的时代光线。`]:[` 这篇文本落在${place}的具体处境中，问题意识来自当时正在处理的现实任务。`,` ${place}不是单纯署名地点，它提示了文本背后的会议、调查或组织场景。`,` 把${place}放进地图里看，能更清楚地理解这篇文字为什么在此时出现。`,` 这里的写作与${place}相关的行动现场相连，语气因此更接近工作中的判断。`];return base+pickText(r.title+'ctx2',add)}
function eventEraContext(e){if(e.id==='e034')return'';if(e.readings?.length||e.tracks.includes('politics')||['e001','e004','e005','e006','e022','e029'].includes(e.id))return eraContextByYear(e.year,e.id+e.title);return''}
function eventContextBlock(e){const text=eventEraContext(e);return text?`<section class="event-context"><strong>时代背景</strong><p>${text}</p></section>`:''}
function keyPoints(r){const second=r.type==='诗词'?['留意词中的地名、季节、天气和行军经验，它们往往承担情绪转折。','先抓住画面和节奏，再回到当时行程，会更容易读出诗词里的历史重量。','把意象和实际路线分开看，能避免把文学表达误读成单纯地理记录。','注意开头的空间调度，很多诗词先把视野拉开，再落到人的行动和判断。','可以观察它怎样用少量景物承载很大的历史情绪。','不要只当抒情读，里面常有行军、胜败、回望和时代判断的痕迹。','地名、天气和颜色常常不是装饰，而是作品组织气势的方式。','先读声音和节奏，再看背景，诗词里的力量会更容易显出来。']:['先看它回应的现实问题，再看它怎样把问题组织成判断、策略或方法。','注意文本面向的听众和任务，是会议报告、讲话、书信还是理论整理，语气会随之变化。','把论点放回当时的组织处境中读，许多抽象判断会变得具体。','可以先问一句：这篇文字当时要解决什么麻烦？答案通常就在结构里。','留意它如何划分对象、敌友、阶段或矛盾，这往往是全文的骨架。','不要只摘一句名言，最好看它前后怎样铺垫问题。','如果是讲话或报告，重点常在“让谁行动起来”和“按什么次序行动”。','把它和同一阶段事件对照，会发现不少判断来自现场压力。'];const third=r.type==='诗词'?['适合和地图上的行程一起读：地点提供现场，诗句提供当时的精神气候。','可与同阶段事件并读，观察战事、回望和抒情如何互相映照。','读完片段后再看地点，会发现诗词常把空间经验压缩成几个强意象。','可以把它当作时间线上的情绪刻度，看看这一阶段的精神状态如何变化。','如果地点是概括点，更要区分实际行程、远望对象和诗中想象。','读这类作品时，地图负责校准位置，诗句负责呈现气象。','与前后节点连读，能看出同一阶段从行动到表达的转换。','它的价值不只在名句，也在把一段历史经验压缩成可记忆的画面。']:['适合和同年事件并读，能看出理论表达与行动安排之间的互相支撑。','读它时不必只看结论，也要看作者如何设置问题、区分对象和安排轻重。','可把它当成一份历史现场中的工作文本，而不只是后来的经典篇名。','与地图节点合看，可以把“观点”还原成某个时间地点上的选择。','读完后再回到事件线，会更容易理解它为什么有这样的语气和重点。','它往往既是理论文字，也是组织内部沟通和动员的一部分。','适合关注它如何从经验中提炼方法，而不是只记住一句结论。','如果觉得抽象，可以先抓住关键词，再回看当时的地点和任务。'];return [r.summary,pickText(r.title+'2',second),pickText(r.title+'3',third)]}
function readingBlocks(e){return(e.readings||[]).map(id=>{const r=readings[id];if(!r)return'';return`<section class="reading-inline"><div class="reading-box reading-context"><strong>时代背景</strong><p>${readingContext(r)}</p></div><div class="reading-box reading-snippet"><strong>精彩片段</strong><p>${featuredSnippet(r)}</p></div><div class="reading-box reading-points"><strong>精华要点</strong><ol>${keyPoints(r).map(point=>`<li>${point}</li>`).join('')}</ol></div></section>`}).join('')}
function eventCard(e){return`<article class="event-card ${e.id===state.selectedEventId?'is-selected':''}" data-event-id="${e.id}"><div class="event-kicker"><strong>${primaryCode(e)}</strong><span>${e.date} · ${ageAt(e)}</span></div><h3>${e.title}</h3><p>${detailText(e)}</p>${e.readings?.length?'':eventContextBlock(e)}${readingBlocks(e)}<div class="chips"><span class="chip">${TRACKS[state.activeTrack].label} ${primaryCode(e)}</span>${buttonsFor(e)}</div></article>`}
function bindCards(root){root.querySelectorAll('.event-card').forEach(c=>c.onclick=e=>{if(e.target.closest('.read-button'))return;selectEvent(c.dataset.eventId,true)});root.querySelectorAll('.read-button').forEach(b=>b.onclick=()=>openReader(b.dataset.readingId))}
function renderSide(group){const selected=events.find(e=>e.id===state.selectedEventId)||group[0];sideCode.textContent=primaryCode(selected);sideTitle.textContent=selected.title;sideIntro.textContent=`${selected.date} · ${selected.place} · ${ageAt(selected)}`;sideBody.innerHTML=eventCard(selected);bindCards(sideBody)}
function renderMapCard(e){mapSelectedCard.innerHTML=e?eventCard(e):'';bindCards(mapSelectedCard)}
function renderMapInfo(group){if(!group.length){mapInfo.innerHTML='';return}const sorted=group.slice().sort((a,b)=>a.year-b.year||a.date.localeCompare(b.date)),names=[...new Set(sorted.map(e=>e.place))];mapInfo.innerHTML=`<div class="map-info-head">${TRACKS[state.activeTrack].label} · ${sorted.length} 条<strong>${names.length===1?names[0]:`${names[0]} 等 ${names.length} 地`}</strong></div>${sorted.map(e=>`<button class="map-info-row ${e.id===state.selectedEventId?'is-selected':''}" data-event-id="${e.id}"><span class="map-info-num">${primaryCode(e)}</span><span class="map-info-title">${e.title}</span><span class="map-info-date">${e.date}</span></button>`).join('')}`;mapInfo.querySelectorAll('.map-info-row').forEach(r=>r.onclick=()=>selectEvent(r.dataset.eventId,true))}
function renderMapInfoForSelection(){const vis=visibleEvents(),sel=vis.find(e=>e.id===state.selectedEventId)||vis[0];renderMapInfo(sel?vis.filter(e=>groupKey(e)===groupKey(sel)):[])}
function selectGroup(key,preferred){const group=visibleEvents().filter(e=>groupKey(e)===key);if(!group.length)return;state.selectedGroupKey=key;state.selectedEventId=preferred||group[0].id;renderSide(group);renderTimeline();syncActive();renderMapInfo(group);renderMapCard(events.find(e=>e.id===state.selectedEventId));scrollTimelineToSelected()}
function selectEvent(id,pan){const e=events.find(x=>x.id===id);if(!e)return;state.selectedEventId=e.id;state.selectedGroupKey=groupKey(e);const group=visibleEvents().filter(x=>groupKey(x)===state.selectedGroupKey);renderSide(group.length?group:[e]);renderTimeline();if(state.hideMarkers)renderMap();else syncActive();renderMapInfo(group.length?group:[e]);renderMapCard(e);scrollTimelineToSelected();if(pan&&state.map)state.map.setView([e.lat,e.lng],Math.min(Math.max(state.map.getZoom(),5),7),{animate:true})}
function scrollTimelineToSelected(){document.querySelector('.timeline-item.is-selected')?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})}function moveTimelineSelection(d){const vis=visibleEvents(),i=vis.findIndex(e=>e.id===state.selectedEventId),n=Math.min(vis.length-1,Math.max(0,(i<0?0:i)+d));if(vis[n]&&n!==i)selectEvent(vis[n].id,true)}
function openReader(id){const r=readings[id];if(!r)return;modalMeta.textContent=`${r.type} · ${r.date} · ${r.place}`;modalTitle.textContent=r.title;if(r.type==='诗词'){const hasFull=Boolean(POEM_FULL_TEXTS[r.title]);modalBody.innerHTML=`<section class="poem-text"><strong>${hasFull?'诗词全文':'诗词节选'}</strong><pre>${poemDisplayText(r)}</pre></section>`}else{modalBody.innerHTML=`<section class="reading-inline"><div class="reading-box reading-context"><strong>时代背景</strong><p>${readingContext(r)}</p></div><div class="reading-box reading-snippet"><strong>精彩片段</strong><p>${featuredSnippet(r)}</p></div><div class="reading-box reading-points"><strong>精华要点</strong><ol>${keyPoints(r).map(point=>`<li>${point}</li>`).join('')}</ol></div></section><p class="reading-note">站内先提供资料摘要；如需核对全文，可打开外部资料页面。</p><p><a href="${sourceUrl(id)}" target="_blank" rel="noopener noreferrer">查看资料页面</a></p>`}readerModal.classList.add('is-open')}function closeReader(){readerModal.classList.remove('is-open')}
function openDisclaimer(){modalMeta.textContent='站点说明';modalTitle.textContent='免责声明';modalBody.innerHTML=`<section class="reading-inline"><div class="reading-box reading-context"><strong>资料视角</strong><p>本页面按中共党史资料视角整理毛泽东生平、政治大事、文章与诗词线索，定位是学习索引和时间地理导航，不是官方出版物、权威年谱或学术定论。</p></div><div class="reading-box reading-points"><strong>使用说明</strong><ol><li>事件、地点和年份尽量依据公开资料整理；多地点事件会用“代表点”标注，表示地图展示位置，不等同于唯一发生地。</li><li>政治事件采用简明党史表述，敏感或复杂事件不在本页展开争议细节，建议结合权威党史资料、年谱和正式研究继续阅读。</li><li>文章与诗词用于资料导航和个人学习；页面内摘要、时代背景、精华要点为辅助理解，不替代原文和正式注释。</li><li>如发现地点、日期、标题或归类有误，应以权威出版物、党史文献和可靠档案资料为准，并及时修订本页。</li></ol></div></section>`;readerModal.classList.add('is-open')}
function renderAll(){const vis=visibleEvents();if(!vis.length){sideCode.textContent='无匹配';sideTitle.textContent='没有找到事件';sideIntro.textContent='换一个关键词，或重新选择线索。';sideBody.innerHTML='';mapSelectedCard.innerHTML=''}else{const selected=vis.find(e=>e.id===state.selectedEventId)||vis[0];state.selectedEventId=selected.id;state.selectedGroupKey=groupKey(selected);const group=vis.filter(e=>groupKey(e)===state.selectedGroupKey);renderSide(group);renderMapCard(selected)}renderStats();renderTimeline();renderMap()}
document.querySelectorAll('.track-button').forEach(btn=>btn.onclick=()=>{state.activeTrack=btn.dataset.track;document.querySelectorAll('.track-button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.track===state.activeTrack)));const vis=visibleEvents();if(vis.length){state.selectedEventId=vis[0].id;state.selectedGroupKey=groupKey(vis[0])}renderAll()});searchInput.oninput=e=>{state.query=e.target.value.trim();renderAll()};disclaimerButton.onclick=openDisclaimer;modalClose.onclick=closeReader;readerModal.onclick=e=>{if(e.target.id==='readerModal')closeReader()};timelineTrack.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();timelineTrack.scrollBy({left:e.deltaY*1.35,behavior:"smooth"})}},{passive:false});timelineTrack.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();moveTimelineSelection(1)}if(e.key==='ArrowLeft'){e.preventDefault();moveTimelineSelection(-1)}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeReader();if(e.target===document.body&&e.key==='ArrowRight')moveTimelineSelection(1);if(e.target===document.body&&e.key==='ArrowLeft')moveTimelineSelection(-1)});
hideMarkersToggle.onchange=e=>{state.hideMarkers=e.target.checked;renderMap()};hideLinesToggle.onchange=e=>{state.hideLines=e.target.checked;renderMap()};
normalizeFootprintTrack();buildCodes();initMap();state.selectedGroupKey=groupKey(events[0]);initVisitorCount();renderAll();
</script>
</body>
</html>
